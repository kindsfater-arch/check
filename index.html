<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сканер чеков</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#3b82f6; --accent2:#2563eb;
    --ok:#22c55e; --err:#ef4444; --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f5f7; --card:#ffffff; --card2:#f7f8fa; --line:#e3e6ea;
      --text:#161a20; --muted:#5c6572; --accent:#2563eb; --accent2:#1d4ed8;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px}
  header{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
  header h1{font-size:19px;margin:0;font-weight:650}
  header .logo{font-size:26px;line-height:1}
  header .sub{color:var(--muted);font-size:12.5px;margin-top:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px}

  /* Зона загрузки */
  .drop{border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--card2)}
  .drop:hover{border-color:var(--accent)}
  .drop.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card2))}
  .drop .big{font-size:34px}
  .drop .t{font-weight:600;margin-top:6px}
  .drop .h{color:var(--muted);font-size:12.5px;margin-top:4px}
  .row-btns{display:flex;gap:10px;margin-top:12px}
  .row-btns button{flex:1}
  input[type=file]{display:none}

  .preview{margin-top:14px;display:none}
  .preview img{width:100%;border-radius:10px;border:1px solid var(--line);max-height:280px;object-fit:contain;background:#000}

  button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:12px 14px;
    cursor:pointer;color:#fff;background:var(--accent);transition:.15s}
  button:hover{background:var(--accent2)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.ghost:hover{background:var(--card2)}
  button.ok{background:var(--ok)}
  button.wide{width:100%}

  .fields{display:none}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input, .field textarea{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:10px 11px;font:inherit;resize:vertical}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}

  .status{display:none;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
    font-size:14px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .status.show{display:flex}
  .status.err{border-color:var(--err);color:var(--err)}
  .status.ok{border-color:var(--ok);color:var(--ok)}
  .spinner{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px}
  .save-row{display:flex;gap:10px;margin-top:6px}
  .save-row button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🧾</div>
    <div>
      <h1>Сканер чеков</h1>
      <div class="sub">Распознавание кассового чека → таблица</div>
    </div>
  </header>

  <!-- Загрузка -->
  <div class="card" id="uploadCard">
    <div class="drop" id="drop">
      <div class="big">📸</div>
      <div class="t">Загрузите фото чека</div>
      <div class="h">Перетащите файл, выберите из галереи или снимите камерой</div>
    </div>
    <div class="row-btns">
      <button class="ghost" id="pickBtn">🖼 Выбрать файл</button>
      <button class="ghost" id="camBtn">📷 Камера</button>
    </div>
    <div class="preview" id="preview"><img id="previewImg" alt=""></div>
    <div class="save-row" id="recognizeRow" style="display:none">
      <button class="wide" id="recognizeBtn">🔍 Распознать чек</button>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <input type="file" id="camInput" accept="image/*" capture="environment">
  </div>

  <!-- Статус -->
  <div class="status" id="status">
    <div class="spinner" id="statusSpin"></div>
    <div id="statusText"></div>
  </div>

  <!-- Поля -->
  <div class="card fields" id="fields">
    <div id="fieldList"></div>
    <div class="save-row">
      <button class="ghost" id="resetBtn">↺ Новый чек</button>
      <button class="ok" id="saveBtn">✅ Сохранить в таблицу</button>
    </div>
  </div>

  <div class="foot">Данные распознаются через Gemini и сохраняются в общую таблицу.</div>
</div>

<script>
// ─── Конфигурация (ключи те же, что в исходном сервисе) ──────────────────────
const GEMINI_API_KEY = 'AIzaSyCGBtzhyTm_1fuo6bGu34jz9MiiSQm1MR0';
const GEMINI_API_URL  = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

// URL Web App существующего проекта бота (Deploy → Web app → …/exec).
// ВСТАВЬ СЮДА после деплоя существующего Apps Script проекта.
const SAVE_ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbyUHFAWxAHSA7DnNgHB4Fa7FpL16y8todggbczJGHsurBspzVxI15HGGJxPRwt-glwc/exec';

// Поля и подписи — 1:1 с Config.gs
const FIELDS = [
  { key:'inn',          label:'ИНН' },
  { key:'store_name',   label:'Название магазина' },
  { key:'legal_name',   label:'Юр. название' },
  { key:'receipt_date', label:'Дата чека' },
  { key:'added_date',   label:'Дата добавления' },
  { key:'address',      label:'Адрес' },
  { key:'bank',         label:'Банк' },
  { key:'comment',      label:'Комментарий' },
];

// Тот же промпт, что в GeminiService.gs
const PROMPT = [
  'Ты — эксперт по распознаванию российских кассовых чеков (ФНС, ОФД, ФФД).',
  'Внимательно изучи изображение чека и извлеки данные.',
  'Даже если изображение нечёткое или сжатое — постарайся извлечь хотя бы часть данных.',
  '',
  'Верни СТРОГО JSON-объект с полями (без пояснений, только JSON):',
  '{',
  '  "inn": "ИНН — 10 или 12 цифр из шапки чека, или null",',
  '  "store_name": "торговое название (Магнит, Пятёрочка и т.п.), или null",',
  '  "legal_name": "юр. название начинающееся с ООО/АО/ИП/ПАО, или null",',
  '  "receipt_date": "дата из строки Дата: в формате ДД.ММ.ГГГГ ЧЧ:ММ, или null",',
  '  "address": "адрес магазина одной строкой, или null",',
  '  "bank": "название банка из раздела оплаты (Сбербанк, Тинькофф, ВТБ, Альфа-Банк и т.п.), или null",',
  '  "comment": "итоговая сумма и способ оплаты до 100 символов, или null"',
  '}',
  '',
  'Правила: все значения однострочные без \\n. Если поле отсутствует — null (не пустая строка).'
].join('\n');

// ─── DOM ─────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('fileInput'), camInput = $('camInput');
const preview = $('preview'), previewImg = $('previewImg');
const recognizeRow = $('recognizeRow'), recognizeBtn = $('recognizeBtn');
const statusEl = $('status'), statusSpin = $('statusSpin'), statusText = $('statusText');
const fieldsCard = $('fields'), fieldList = $('fieldList');
const saveBtn = $('saveBtn'), resetBtn = $('resetBtn');

let currentBase64 = null;   // base64 без префикса
let currentMime = 'image/jpeg';

// ─── Выбор файла ─────────────────────────────────────────────────────────────
$('pickBtn').onclick = () => fileInput.click();
$('camBtn').onclick  = () => camInput.click();
drop.onclick = () => fileInput.click();

['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop', e => {
  if (e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
camInput.onchange  = e => e.target.files[0] && loadFile(e.target.files[0]);

function loadFile(file){
  if (!file.type || file.type.indexOf('image/') !== 0){
    showStatus('err', '❌ Это не изображение. Загрузите фото чека.'); return;
  }
  currentMime = file.type;
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    currentBase64 = dataUrl.split(',')[1];
    previewImg.src = dataUrl;
    preview.style.display = 'block';
    recognizeRow.style.display = 'flex';
    hideStatus();
    fieldsCard.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

// ─── Распознавание через Gemini ──────────────────────────────────────────────
recognizeBtn.onclick = analyze;

async function analyze(){
  if (!currentBase64){ showStatus('err','Сначала загрузите фото.'); return; }
  recognizeBtn.disabled = true;
  showStatus('load', 'Распознаю чек, подождите…');
  fieldsCard.style.display = 'none';

  const payload = {
    contents: [{ parts: [
      { text: PROMPT },
      { inline_data: { mime_type: currentMime, data: currentBase64 } }
    ]}],
    generationConfig: { temperature: 0.2, maxOutputTokens: 2048, responseMimeType: 'application/json' }
  };

  try {
    const resp = await fetch(GEMINI_API_URL + '?key=' + GEMINI_API_KEY, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const body = await resp.text();
    if (!resp.ok) throw new Error('Gemini API ' + resp.status + ': ' + body);

    const parsed = JSON.parse(body);
    const cand = parsed.candidates && parsed.candidates[0];
    if (!cand) throw new Error('Пустой ответ Gemini');
    const text = cand.content.parts[0].text;

    const data = parseGeminiJson(text);
    normalize(data);
    renderFields(data);
    hideStatus();
  } catch (err){
    showStatus('err', '❌ Ошибка распознавания: ' + err.message);
  } finally {
    recognizeBtn.disabled = false;
  }
}

function parseGeminiJson(text){
  const clean = text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  try { return JSON.parse(clean); }
  catch(e){
    const s = clean.indexOf('{'), en = clean.lastIndexOf('}');
    if (s !== -1 && en > s){ try { return JSON.parse(clean.substring(s, en+1)); } catch(e2){} }
    return {};
  }
}

function normalize(data){
  // Дата добавления — всегда текущая (Gemini её не знает)
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  data.added_date = dd + '.' + mm + '.' + now.getFullYear();
  FIELDS.forEach(f => {
    let v = data[f.key];
    if (v === undefined || v === null) { data[f.key] = ''; return; }
    if (typeof v === 'string') data[f.key] = v.replace(/[\r\n]+/g,' ').trim();
    else data[f.key] = String(v);
  });
}

// ─── Форма полей ─────────────────────────────────────────────────────────────
function renderFields(data){
  fieldList.innerHTML = '';
  FIELDS.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const isLong = (f.key === 'address' || f.key === 'comment');
    wrap.innerHTML =
      '<label for="fld_'+f.key+'">'+f.label+'</label>' +
      (isLong
        ? '<textarea id="fld_'+f.key+'" rows="2"></textarea>'
        : '<input id="fld_'+f.key+'" type="text">');
    fieldList.appendChild(wrap);
    $('fld_'+f.key).value = data[f.key] || '';
  });
  fieldsCard.style.display = 'block';
  fieldsCard.scrollIntoView({behavior:'smooth', block:'start'});
}

function collectData(){
  const data = {};
  FIELDS.forEach(f => data[f.key] = $('fld_'+f.key).value.trim());
  return data;
}

// ─── Сохранение в таблицу через Apps Script ──────────────────────────────────
saveBtn.onclick = save;

async function save(){
  if (SAVE_ENDPOINT_URL.indexOf('PASTE_') === 0){
    showStatus('err','⚠️ Не задан URL Apps Script. Вставьте его в SAVE_ENDPOINT_URL.');
    return;
  }
  const data = collectData();
  saveBtn.disabled = true;
  showStatus('load','Сохраняю в таблицу…');

  const bodyStr = JSON.stringify({ action:'save_receipt', userId:'web', userName:'web', data:data });

  // Единственный no-cors POST: Apps Script не отдаёт CORS-заголовки, поэтому
  // ответ прочитать нельзя, но appendRow выполняется. Один запрос = одна строка
  // (обычный fetch отклонился бы по CORS и провоцировал бы дубль-запись).
  try {
    await fetch(SAVE_ENDPOINT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // simple request, без preflight
      body: bodyStr
    });
    done();
  } catch (err){
    showStatus('err','❌ Ошибка сохранения: ' + err.message);
    saveBtn.disabled = false;
  }
}

function done(){
  showStatus('ok','✅ Чек сохранён в таблицу.');
  saveBtn.disabled = false;
  setTimeout(resetAll, 1400);
}

// ─── Сброс ───────────────────────────────────────────────────────────────────
resetBtn.onclick = resetAll;
function resetAll(){
  currentBase64 = null;
  fileInput.value = ''; camInput.value = '';
  preview.style.display = 'none';
  recognizeRow.style.display = 'none';
  fieldsCard.style.display = 'none';
  hideStatus();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ─── Статус ──────────────────────────────────────────────────────────────────
function showStatus(kind, text){
  statusEl.className = 'status show' + (kind==='err'?' err':kind==='ok'?' ok':'');
  statusSpin.style.display = (kind==='load') ? 'block' : 'none';
  statusText.textContent = text;
}
function hideStatus(){ statusEl.className = 'status'; }
</script>
</body>
</html>
